name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/background.js
          test -f dist/popup.js
          echo "Build verification passed"

      - name: Run browser tests
        run: |
          npm run test:e2e
          npm run test:e2e:tabs
          npm run test:e2e:send-safety
          npm run test:e2e:popup-links
          npm run test:e2e:theme-window

  build-and-release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch full history for semantic versioning

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build extension for production
        run: npm run build --production

      - name: Copy manifest and other assets
        run: |
          cp public/manifest.json dist/
          cp public/popup.html dist/
          cp public/options.html dist/
          cp -r public/icons dist/

      - name: Get current version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check for an existing release
        id: check_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Commits that don't bump the version have nothing new to release. A tag
          # without a release means an earlier run failed partway, so finish it.
          TAG="v${{ steps.get_version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "released=true" >> $GITHUB_OUTPUT
            echo "$TAG is already released, skipping"
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tagged=true" >> $GITHUB_OUTPUT
          fi

      - name: Create release tag
        id: create_tag
        if: steps.check_release.outputs.released != 'true'
        run: |
          TAG="v${{ steps.get_version.outputs.version }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          if [ "${{ steps.check_release.outputs.tagged }}" = "true" ]; then
            # Finishing a failed release is only honest if this is the tagged code.
            if [ "$(git rev-parse "refs/tags/$TAG^{commit}")" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG points at a different commit; bump the version to release this one."
              exit 1
            fi
            exit 0
          fi
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag $TAG
          git push origin $TAG

      - name: Package extension
        if: steps.check_release.outputs.released != 'true'
        run: |
          cd dist
          zip -r ../pushbridge-${{ steps.get_version.outputs.version }}.zip .
          cd ..

      - name: Create Release
        if: steps.check_release.outputs.released != 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.create_tag.outputs.tag }}
          name: PushBridge ${{ steps.get_version.outputs.version }}
          body: |
            ## PushBridge ${{ steps.get_version.outputs.version }}

            ### Changes
            - See commit history for detailed changes

            ### Installation
            1. Download the `pushbridge-${{ steps.get_version.outputs.version }}.zip` file
            2. Extract the contents
            3. Load the extension in Chrome Developer Mode

            ### Compatibility
            - Chrome Extension Manifest V3
            - Node.js 24+ for development
          files: |
            pushbridge-${{ steps.get_version.outputs.version }}.zip
          draft: false
          prerelease: false
